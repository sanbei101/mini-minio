name: Multi-Disk Erasure Coding Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  Test-and-Benchmark:
    name: Test and Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Run tests
        run: |
          find . -name "*_test.go" | xargs -n 1 dirname | sort -u | grep -v '/copy' | xargs go test -v | tee test-results.txt

      - name: Run benchmarks
        uses: sanbei101/go-bench-pprof-action@v1
        with:
          top: 20
          exclude: copy