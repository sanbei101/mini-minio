name: test and benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  Test-and-Benchmark:
    name: Test and Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Run tests and benchmarks
        uses: sanbei101/go-bench-pprof-action@v1
        with:
          top: 20
          exclude: copy
