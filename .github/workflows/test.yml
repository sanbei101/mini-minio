name: Multi-Disk Erasure Coding Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  Test-and-Benchmark:
    name: Test and Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Run tests
        run: |
          find . -name "*_test.go" | xargs -n 1 dirname | sort -u | grep -v '/copy' | xargs go test -v | tee test-results.txt

      - name: Run benchmark with profiling
        run: |
          mkdir -p pprof-results
          
          DIRS=$(find . -name "*_test.go" | xargs -n 1 dirname | sort -u | grep -v '/copy')
          
          echo "=== 🚀 开始进行跑分与性能采样 ==="
          echo "" > benchmark-results.txt
          
          for dir in $DIRS; do
            pkg_name=$(basename "$dir")
            echo "正在对组件 [$pkg_name] 进行性能采样..."
            
            go test -bench=. -v -run="^(Benchmark)" \
              -cpuprofile="pprof-results/${pkg_name}_cpu.pprof" \
              -memprofile="pprof-results/${pkg_name}_mem.pprof" \
              "$dir" >> benchmark-results.txt 2>&1
          done

      - name: Save test results as summary
        if: success() || failure()
        run: |
          echo "### 🧪 Unit Test Results" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat test-results.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Save benchmark results as summary
        if: success() || failure()
        run: |
          echo "### 🏎️ Benchmark Output" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat benchmark-results.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Analyze pprof
        if: success() || failure()
        run: |
          echo "## 🕵️‍♂️ Pprof 自动化性能洞察" >> $GITHUB_STEP_SUMMARY
          
          echo "### 🧠 CPU 耗时函数 Top 10" >> $GITHUB_STEP_SUMMARY
          for prof in pprof-results/*_cpu.pprof; do
            if [ -f "$prof" ]; then
              pkg=$(basename "$prof" _cpu.pprof)
              echo "#### 📦 组件: $pkg" >> $GITHUB_STEP_SUMMARY
              echo '```text' >> $GITHUB_STEP_SUMMARY
              go tool pprof -text -nodecount=10 "$prof" >> $GITHUB_STEP_SUMMARY 2>&1 || echo "(该组件未捕获到常态 Bench 数据)" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            fi
          done

          echo "### 💾 内存分配空间 Top 10" >> $GITHUB_STEP_SUMMARY
          for prof in pprof-results/*_mem.pprof; do
            if [ -f "$prof" ]; then
              pkg=$(basename "$prof" _mem.pprof)
              echo "#### 📦 组件: $pkg" >> $GITHUB_STEP_SUMMARY
              echo '```text' >> $GITHUB_STEP_SUMMARY
              go tool pprof -text -nodecount=10 -inuse_space "$prof" >> $GITHUB_STEP_SUMMARY 2>&1 || echo "(该组件未捕获到常态 Bench 数据)" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Upload Pprof Artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v6
        with:
          name: mini-minio-pprof-profiles
          path: pprof-results/
          retention-days: 7