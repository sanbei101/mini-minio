name: Warp S3 Benchmark

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  cluster-integration:
    name: Distributed Cluster Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: true

      - name: Install mc, Warp, and zip
        run: |
          wget https://dl.min.io/client/mc/release/linux-amd64/mc -O mc
          chmod +x mc
          sudo mv mc /usr/local/bin/
          wget https://dl.min.io/aistor/warp/release/linux-amd64/warp.deb -O warp.deb
          sudo dpkg -i warp.deb
          sudo apt update
          sudo apt install --yes zip

      - name: Start two-node erasure cluster
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
          GOAMD64: v3
        run: |
          set -euo pipefail
          go build -trimpath -ldflags="-s -w" -o mini-minio .

          root="$RUNNER_TEMP/mini-minio-cluster"
          mkdir -p "$root/a1" "$root/a2" "$root/b1" "$root/b2"

          endpoints=(
            "http://127.0.0.1:19000$root/a1"
            "http://127.0.0.1:19000$root/a2"
            "http://127.0.0.1:19001$root/b1"
            "http://127.0.0.1:19001$root/b2"
          )

          ./mini-minio \
            --addr 127.0.0.1:19000 \
            --node-url http://127.0.0.1:19000 \
            --data-blocks 2 \
            --parity-blocks 2 \
            --cluster-secret ci-cluster-secret \
            --endpoint "${endpoints[0]}" \
            --endpoint "${endpoints[1]}" \
            --endpoint "${endpoints[2]}" \
            --endpoint "${endpoints[3]}" \
            --access-key minioadmin \
            --secret-key minioadmin123 > node-a.log 2>&1 &
          echo $! > node-a.pid

          ./mini-minio \
            --addr 127.0.0.1:19001 \
            --node-url http://127.0.0.1:19001 \
            --data-blocks 2 \
            --parity-blocks 2 \
            --cluster-secret ci-cluster-secret \
            --endpoint "${endpoints[0]}" \
            --endpoint "${endpoints[1]}" \
            --endpoint "${endpoints[2]}" \
            --endpoint "${endpoints[3]}" \
            --access-key minioadmin \
            --secret-key minioadmin123 > node-b.log 2>&1 &
          echo $! > node-b.pid

      - name: Wait for both S3 endpoints
        run: |
          set -euo pipefail
          mc alias set node-a http://127.0.0.1:19000 minioadmin minioadmin123
          mc alias set node-b http://127.0.0.1:19001 minioadmin minioadmin123
          for attempt in $(seq 1 30); do
            if mc ls node-a >/dev/null 2>&1 && mc ls node-b >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat node-a.log
          cat node-b.log
          exit 1

      - name: Test cross-node PUT and GET
        run: |
          set -euo pipefail
          mc mb node-a/test-bucket
          dd if=/dev/urandom of=payload.bin bs=1M count=8 status=none
          zip -q -0 test.zip payload.bin

          mc cp --disable-multipart test.zip node-a/test-bucket/test.zip
          mc cp node-b/test-bucket/test.zip downloaded-from-node-b.zip
          cmp test.zip downloaded-from-node-b.zip

      - name: Test multipart across nodes
        run: |
          set -euo pipefail
          dd if=/dev/urandom of=large-payload.bin bs=1M count=80 status=none
          zip -q -0 multipart.zip large-payload.bin

          mc cp multipart.zip node-b/test-bucket/multipart.zip
          mc cp node-a/test-bucket/multipart.zip multipart-downloaded.zip
          cmp multipart.zip multipart-downloaded.zip

      - name: Benchmark distributed cluster with Warp
        run: |
          set -euo pipefail
          common=(
            --host=127.0.0.1:19000,127.0.0.1:19001 \
            --host-select=roundrobin \
            --access-key=minioadmin \
            --secret-key=minioadmin123 \
            --region=us-east-1 \
            --duration=20s \
            --concurrent=8 \
            --analyze.v
          )

          warp put "${common[@]}" \
            --bucket=cluster-warp-put \
            --obj.size=1MiB 2>&1 | tee cluster-warp-put.log

          warp get "${common[@]}" \
            --bucket=cluster-warp-get \
            --objects=100 \
            --obj.size=1MiB 2>&1 | tee cluster-warp-get.log

          warp mixed "${common[@]}" \
            --bucket=cluster-warp-mixed \
            --objects=100 \
            --obj.size=256KiB \
            --get-distrib=45 \
            --stat-distrib=25 \
            --put-distrib=20 \
            --delete-distrib=10 2>&1 | tee cluster-warp-mixed.log

          warp multipart "${common[@]}" \
            --bucket=cluster-warp-multipart \
            --parts=16 \
            --part.size=5MiB 2>&1 | tee cluster-warp-multipart.log

          echo '## Distributed Cluster Warp Benchmarks' >> "$GITHUB_STEP_SUMMARY"
          echo 'Two S3 endpoints are exercised in round-robin order. Results use one GitHub runner and loopback networking, so they are regression data, not physical two-machine throughput.' >> "$GITHUB_STEP_SUMMARY"
          for log in cluster-warp-put.log cluster-warp-get.log cluster-warp-mixed.log cluster-warp-multipart.log; do
            echo "### $log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            sed -r "s/\x1B\[[0-9;]*[a-zA-Z]//g" "$log" | tail -n 100 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Stop cluster and print logs
        if: always()
        run: |
          kill "$(cat node-a.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat node-b.pid 2>/dev/null)" 2>/dev/null || true
          wait "$(cat node-a.pid 2>/dev/null)" 2>/dev/null || true
          wait "$(cat node-b.pid 2>/dev/null)" 2>/dev/null || true
          echo '--- node-a.log ---'
          tail -n 100 node-a.log 2>/dev/null || true
          echo '--- node-b.log ---'
          tail -n 100 node-b.log 2>/dev/null || true

  warp-benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: true

      - name: Install mc and warp
        run: |
          wget https://dl.min.io/client/mc/release/linux-amd64/mc -O mc
          chmod +x mc
          sudo mv mc /usr/local/bin/

          wget https://dl.min.io/aistor/warp/release/linux-amd64/warp.deb -O warp.deb
          sudo dpkg -i warp.deb

      - name: Start mini-minio Server
        run: |
          go build -trimpath -ldflags="-s -w" -o mini-minio .
          ./mini-minio -addr=":9000" -access-key="minioadmin" -secret-key="minioadmin123" > server.log 2>&1 &
          sleep 3
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
          GOAMD64: v3

      - name: Create bucket for benchmark
        run: |
          mc alias set myminio http://127.0.0.1:9000 minioadmin minioadmin123
          mc mb myminio/test-bucket-compatibility

      - name: Run Warp S3 Benchmark
        run: |
          warp mixed --host=127.0.0.1:9000 \
           --access-key=minioadmin \
           --secret-key=minioadmin123 \
           --region=us-east-1 \
           --noclear \
           --autoterm \
           --objects=50 \
           --obj.size=64KiB 2>&1 | tee warp.log
          echo "## S3 Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          # 使用 sed 去除所有 ANSI 转义序列后再输出
          sed -r "s/\x1B\[[0-9;]*[a-zA-Z]//g" warp.log | tail -n 100 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Stop mini-minio Server
        if: always()
        run: |
          pkill mini-minio || true
          tail -n 100 server.log

  # =========================================================================
  # 真实环境阶段：前置测试全部成功后拉起阿里云两台机器进行真实内网压测
  # =========================================================================
  aliyun-real-cluster-benchmark:
    name: Real Cluster Benchmark on AliCloud
    needs: [cluster-integration, warp-benchmark]
    runs-on: ubuntu-latest
    env:
      ALICLOUD_ACCESS_KEY: ${{ secrets.ALICLOUD_ACCESS_KEY }}
      ALICLOUD_SECRET_KEY: ${{ secrets.ALICLOUD_SECRET_KEY }}
      ALICLOUD_REGION: ${{ secrets.ALICLOUD_REGION || 'cn-hangzhou' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: true

      - name: Build mini-minio Binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
          GOAMD64: v3
        run: go build -trimpath -ldflags="-s -w" -o mini-minio .


      - name: Download Warp Package
        run: |
          wget https://dl.min.io/aistor/warp/release/linux-amd64/warp.deb -O warp.deb

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform Apply
        working-directory: .github
        run: |
          set -euo pipefail
          terraform init -upgrade
          terraform apply -auto-approve

          NODE0_PUB=$(terraform output -json node_ips | jq -r '.node_0.public_ip')
          NODE0_PRIV=$(terraform output -json node_ips | jq -r '.node_0.private_ip')
          NODE1_PUB=$(terraform output -json node_ips | jq -r '.node_1.public_ip')
          NODE1_PRIV=$(terraform output -json node_ips | jq -r '.node_1.private_ip')

          echo "NODE0_PUB=$NODE0_PUB" >> $GITHUB_ENV
          echo "NODE0_PRIV=$NODE0_PRIV" >> $GITHUB_ENV
          echo "NODE1_PUB=$NODE1_PUB" >> $GITHUB_ENV
          echo "NODE1_PRIV=$NODE1_PRIV" >> $GITHUB_ENV

      - name: Wait for SSH Readiness
        working-directory: .github
        run: |
          set -euo pipefail
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 -i id_rsa_spot"

          wait_node() {
            local ip=$1
            for attempt in $(seq 1 45); do
              if ssh $SSH_OPTS root@$ip "echo ok" >/dev/null 2>&1; then
                echo "Node $ip SSH is ready."
                return 0
              fi
              echo "Waiting for $ip SSH (attempt $attempt/45)..."
              sleep 3
            done
            echo "SSH connection failed on $ip"
            return 1
          }

          wait_node "$NODE0_PUB"
          wait_node "$NODE1_PUB"

      - name: Deploy mini-minio Cluster to ECS
        working-directory: .github
        run: |
          set -euo pipefail
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i id_rsa_spot"

          for IP in "$NODE0_PUB" "$NODE1_PUB"; do
            scp $SSH_OPTS mini-minio warp.deb root@$IP:/root/
            ssh $SSH_OPTS root@$IP "dpkg -i /root/warp.deb && mkdir -p /data/d1 /data/d2"
          done

          ENDPOINTS="--endpoint http://${NODE0_PRIV}:9000/data/d1 --endpoint http://${NODE0_PRIV}:9000/data/d2 --endpoint http://${NODE1_PRIV}:9000/data/d1 --endpoint http://${NODE1_PRIV}:9000/data/d2"

          ssh $SSH_OPTS root@$NODE0_PUB "nohup /root/mini-minio \
            --addr :9000 \
            --node-url http://${NODE0_PRIV}:9000 \
            --cluster-secret aliyun-cluster-secret \
            --data-blocks 2 \
            --parity-blocks 2 \
            $ENDPOINTS \
            --access-key minioadmin \
            --secret-key minioadmin123 > /root/mini-minio.log 2>&1 &"

          ssh $SSH_OPTS root@$NODE1_PUB "nohup /root/mini-minio \
            --addr :9000 \
            --node-url http://${NODE1_PRIV}:9000 \
            --cluster-secret aliyun-cluster-secret \
            --data-blocks 2 \
            --parity-blocks 2 \
            $ENDPOINTS \
            --access-key minioadmin \
            --secret-key minioadmin123 > /root/mini-minio.log 2>&1 &"

          sleep 5

      - name: Run VPC Intranet Warp Benchmark
        working-directory: .github
        run: |
          set -euo pipefail
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i id_rsa_spot"

          ssh $SSH_OPTS root@$NODE0_PUB "warp put \
            --host=${NODE0_PRIV}:9000,${NODE1_PRIV}:9000 \
            --host-select=roundrobin \
            --access-key=minioadmin \
            --secret-key=minioadmin123 \
            --region=us-east-1 \
            --duration=25s \
            --concurrent=16 \
            --bucket=aliyun-warp-put \
            --obj.size=4MiB \
            --analyze.v" | tee aliyun-warp-put.log

          ssh $SSH_OPTS root@$NODE0_PUB "warp get \
            --host=${NODE0_PRIV}:9000,${NODE1_PRIV}:9000 \
            --host-select=roundrobin \
            --access-key=minioadmin \
            --secret-key=minioadmin123 \
            --region=us-east-1 \
            --duration=25s \
            --concurrent=16 \
            --bucket=aliyun-warp-get \
            --objects=200 \
            --obj.size=4MiB \
            --analyze.v" | tee aliyun-warp-get.log

          echo "## 🚀 AliCloud 2-Node Distributed Benchmark Results" >> "$GITHUB_STEP_SUMMARY"
          echo "Benchmark performed across two ECS instances via VPC intranet" >> "$GITHUB_STEP_SUMMARY"

          for log in aliyun-warp-put.log aliyun-warp-get.log; do
            echo "### $log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            sed -r "s/\x1B\[[0-9;]*[a-zA-Z]//g" "$log" | tail -n 80 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Destroy Infrastructure
        working-directory: .github
        if: always()
        run: |
          echo "Destroying AliCloud infrastructure..."
          terraform destroy -auto-approve
